[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archolith-bench"
version = "0.4.0"
description = "Benchmark suite for the archolith token-reduction stack"
license = "Apache-2.0"
authors = [{name = "Charles Harvey"}]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["benchmark", "llm", "token-reduction", "context-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "archolith-maintenance>=0.1.0",
]

[project.optional-dependencies]
filter = ["archolith-filter"]
audit = ["archolith-audit"]
# External-benchmark harness extras (real official tools, installed on demand).
longbench = ["datasets>=2"]
longmemeval = ["datasets>=2"]
bigcodebench = ["datasets>=2"]
swebench = ["swebench>=2"]
cyberseceval = ["datasets>=2"]
agentdojo = ["agentdojo>=0.1"]
mteb = ["mteb>=1.0"]
harness = ["datasets>=2"]
content-vector = ["neo4j>=5.0", "openai>=1.0"]
# Bolt read path for the menhir-scalar-state e2e harness (shadow Views are not recall-visible).
menhir-scalar = ["neo4j>=5.0"]
# Offline research parser only; this is intentionally excluded from `all` and `dev`.
# The official en_core_web_sm 3.8.0 metadata requires spaCy >=3.8,<3.9 and is ~12 MB.
research-parser = [
    "spacy==3.8.14",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]
all = ["archolith-filter", "archolith-audit", "datasets>=2"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Archolith/archolith-bench"
Issues = "https://github.com/Archolith/archolith-bench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["archolith_bench*"]

[project.scripts]
archolith-bench = "archolith_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["experiments", "results", "logs", "build", "dist", "*.egg-info"]

[tool.ruff]
exclude = ["experiments"]
