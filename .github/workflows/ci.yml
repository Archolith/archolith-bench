name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly drift check against menhir main -- see the menhir-canary job. Scheduled
  # runs only ever fire on the default branch, which is what we want here.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (bench package + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.4"
      # Scoped to the bench package + tests; scripts/ carry separate pre-existing
      # lint debt and are out of scope for this gate.
      - name: Ruff check
        run: python -m ruff check archolith_bench tests

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        # The suite writes through the system temp dir; Windows is the platform
        # where that has actually broken, so it needs a real leg rather than a
        # docs note. One version is enough -- this leg guards path/temp
        # handling, not version compatibility.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # These sibling packages are public but not on PyPI; install them from
      # GitHub. archolith-maintenance is a required dependency; archolith-filter
      # and archolith-mcp-audit are the optional audit/filter integrations that
      # the suite smoke test exercises (installing them un-skips it — see
      # tests/conftest.py).
      - name: Install sibling packages (git; public, not on PyPI)
        run: |
          python -m pip install "archolith-maintenance @ git+https://github.com/Archolith/archolith-maintenance.git"
          python -m pip install "git+https://github.com/Archolith/archolith-filter.git"
          python -m pip install "git+https://github.com/Archolith/archolith-mcp-audit.git"

      - name: Install archolith-bench (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      # Catches import-time breakage in a command group, which the unit suite
      # does not exercise -- these are the documented entry points.
      - name: CLI smoke
        run: |
          python -m archolith_bench --help
          python -m archolith_bench proxy --list
          python -m archolith_bench harness --list
          python -m archolith_bench menhir list

      # tests/test_dependency_scalar_bridge_measurement.py resolves a menhir
      # checkout (MENHIR_ROOT or an unambiguous sibling) and measures the
      # dependency-scalar bridge against menhir's real API. menhir is public, so
      # CI checks it out rather than skipping those three tests. Checked out to a
      # dot-path so it cannot be picked up as an implicit sibling candidate --
      # MENHIR_ROOT below is the only resolution input.
      - name: Check out menhir (dependency-scalar bridge tests)
        uses: actions/checkout@v4
        with:
          repository: Archolith/menhir
          path: .menhir-src
          # PINNED. These tests measure bench's expectations against menhir's real
          # API, so an unpinned default branch lets a menhir commit turn this repo
          # red with no bench change -- which is exactly what happened on the first
          # run here (menhir 4ecf5e8a made counts fail-closed and the noisy-slice
          # expectations went stale).
          #
          # To bump: move this ref forward, run the suite against the new commit,
          # and land any expectation changes in the SAME commit as the bump, so the
          # diff shows which menhir change moved which number.
          # Pinned 2026-09-08 to menhir main @ 2026-09-07; suite green at 1016 passed.
          ref: f145640f9bafc3063388e64b67b4b208742aaa46

      # The bench loaders import menhir's pure-domain and service modules by path.
      # Those modules need three of menhir's runtime deps at import time; the other
      # twelve (graphiti-core, neo4j, fastmcp, ...) are never reached, so this
      # installs the three rather than the whole dependency set. If a future menhir
      # change adds an import to these modules, the suite fails loudly with a
      # ModuleNotFoundError naming the missing package -- add it here.
      - name: Install menhir import-time deps (subset)
        run: python -m pip install openai httpx pydantic

      # The R3/R5 ladder benches import menhir as a MODULE at import time; that
      # still requires menhir on sys.path, which this checkout deliberately does
      # not do, so tests/conftest.py continues to skip them. This runs the offline
      # bench mechanism suite (metrics, ranking ladders, fixture validators,
      # cost/token models) plus the audit/filter smoke test.
      - name: Run offline bench suite
        env:
          MENHIR_ROOT: ${{ github.workspace }}/.menhir-src
        run: python -m pytest tests/ -q

  # Drift canary: the same suite, but against menhir's CURRENT main instead of the
  # pinned ref the `test` job uses. Its purpose is to answer one question on a
  # schedule -- "has menhir moved in a way that invalidates a bench expectation?" --
  # without letting that block anyone's push. The pinned job is the gate; this is
  # the early warning.
  #
  # A failure here does NOT mean bench is broken. It means the pin is now behind a
  # menhir change that moves a measured number, and bumping it (see the `ref:`
  # comment in the test job) will require updating expectations in the same commit.
  menhir-canary:
    name: menhir drift canary (unpinned)
    # Never on push or pull_request -- that is what pinning exists to prevent.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install sibling packages (git; public, not on PyPI)
        run: |
          python -m pip install "archolith-maintenance @ git+https://github.com/Archolith/archolith-maintenance.git"
          python -m pip install "git+https://github.com/Archolith/archolith-filter.git"
          python -m pip install "git+https://github.com/Archolith/archolith-mcp-audit.git"

      - name: Install archolith-bench (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      # Deliberately unpinned -- tracking menhir main is the entire point.
      - name: Check out menhir (main, unpinned)
        uses: actions/checkout@v4
        with:
          repository: Archolith/menhir
          path: .menhir-src

      - name: Install menhir import-time deps (subset)
        run: python -m pip install openai httpx pydantic

      # Names the commit under test, so a failure notification says which menhir
      # revision moved the number rather than just "canary failed".
      - name: Report menhir revision under test
        run: |
          cd .menhir-src
          echo "menhir main @ $(git rev-parse HEAD)"
          echo "  $(git log -1 --format='%ci  %s')"

      - name: Run offline bench suite against menhir main
        env:
          MENHIR_ROOT: ${{ github.workspace }}/.menhir-src
        run: python -m pytest tests/ -q
